server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend container (service name "backend" in docker-compose)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # everything else is the React app
    location / {
        try_files $uri /index.html;
    }
}
